  output-dir: docs

website:
  title: "Ivan Tan"
  description: "Year 1 Applied AI student at SIT — projects, notes, and a bit of life."
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: project.qmd
        text: Project
      - href: dataviz.qmd
        text: Data Viz
      - href: genai-reflection.qmd
        text: GenAI Reflection
    right:
      - icon: github
        href: https://github.com/your-username
        aria-label: GitHub
      - icon: linkedin
        href: https://linkedin.com/in/your-username
        aria-label: LinkedIn
  page-footer:
