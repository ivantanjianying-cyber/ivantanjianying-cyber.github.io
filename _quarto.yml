format:
  html:
    # Built-in themes you can swap to: cosmo, flatly, journal, litera,
    # lumen, minty, sandstone, simplex, sketchy, united, yeti, zephyr.
    # Pair light + dark for a toggle in the navbar.
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-location: right
    code-copy: true
    code-overflow: wrap
